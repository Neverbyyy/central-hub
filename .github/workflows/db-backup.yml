name: Дамп базы

# В бесплатном Supabase нет бэкапов — раз в сутки снимаем дамп и храним 30 дней в артефактах
on:
  schedule:
    - cron: '0 2 * * *' # 05:00 по Москве
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # Подключение через Session pooler: прямой адрес базы только IPv6, а раннеры GitHub его не умеют.
      # Секрет — пароль базы (SUPABASE_DB_PASSWORD из .env); адрес не секретный и собирается здесь.
      # Готовая строка подключения в секрете тоже подойдёт.
      - name: Дамп ролей, схемы и данных
        env:
          SECRET_VALUE: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.SUPABASE_DB_URL }}
          PROJECT_REF: phjceqfrbfmptwvlqpde
          POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
        run: |
          # Вставленный секрет мог захватить перевод строки, пробелы, кавычки или всю строку из .env — убираем
          value="$(printf '%s' "$SECRET_VALUE" | tr -d '\r\n')"
          value="${value#"${value%%[![:space:]]*}"}"; value="${value%"${value##*[![:space:]]}"}"
          value="${value#SUPABASE_DB_PASSWORD=}"; value="${value#SUPABASE_DB_URL=}"
          value="${value#[\"\']}"; value="${value%[\"\']}"

          # Ни пароль, ни адрес в лог не выводятся — только что с ними не так
          fail() { echo "::error::Секрет SUPABASE_DB_PASSWORD: $1. См. README, раздел «CI и бэкапы»"; exit 1; }
          [ -n "$value" ] || fail "его нет — вставьте пароль базы из .env"
          case "$value" in
            postgresql://*|postgres://*) url="$value" ;;
            *)
              case "$value" in *[[:space:]]*) fail "в пароле пробел — похоже, вставлен не пароль" ;; esac
              password="$(P="$value" node -e 'process.stdout.write(encodeURIComponent(process.env.P))')"
              url="postgresql://postgres.${PROJECT_REF}:${password}@${POOLER_HOST}:5432/postgres"
              ;;
          esac
          case "$url" in *@*pooler.supabase.com:5432/*) ;; *) fail "в строке подключения нужен адрес Session pooler (…pooler.supabase.com:5432)" ;; esac

          mkdir backup
          supabase db dump --db-url "$url" -f backup/roles.sql --role-only
          supabase db dump --db-url "$url" -f backup/schema.sql
          supabase db dump --db-url "$url" -f backup/data.sql --use-copy --data-only
          gzip backup/*.sql
          ls -l backup
          echo "DUMP_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.DUMP_DATE }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
