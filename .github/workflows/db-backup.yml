name: Дамп базы

# В бесплатном Supabase нет бэкапов — раз в сутки снимаем дамп и храним 30 дней в артефактах
on:
  schedule:
    - cron: '0 2 * * *' # 05:00 по Москве
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      # SUPABASE_DB_URL — строка Session pooler: прямой адрес базы только IPv6, а раннеры GitHub его не умеют
      - name: Дамп ролей, схемы и данных
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Вставленный секрет мог захватить перевод строки, пробелы или кавычки по краям — убираем их
          url="$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n')"
          url="${url#"${url%%[![:space:]]*}"}"; url="${url%"${url##*[![:space:]]}"}"
          url="${url#[\"\']}"; url="${url%[\"\']}"

          # Сам адрес в лог не выводится — только что с ним не так
          fail() { echo "::error::Секрет SUPABASE_DB_URL: $1. Нужна строка Session pooler — см. README, раздел «CI и бэкапы»"; exit 1; }
          [ -n "$url" ] || fail "его нет"
          case "$url" in postgresql://*|postgres://*) ;; *) fail "должен начинаться с postgresql://" ;; esac
          case "$url" in *[[:space:]\<\>\"\']*) fail "внутри пробелы, кавычки или угловые скобки — похоже, вставлен шаблон вместо готовой строки" ;; esac
          case "$url" in *@*pooler.supabase.com:5432/*) ;; *) fail "нужен адрес Session pooler (…pooler.supabase.com:5432), прямой адрес базы раннерам недоступен" ;; esac

          mkdir backup
          supabase db dump --db-url "$url" -f backup/roles.sql --role-only
          supabase db dump --db-url "$url" -f backup/schema.sql
          supabase db dump --db-url "$url" -f backup/data.sql --use-copy --data-only
          gzip backup/*.sql
          ls -l backup
          echo "DUMP_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.DUMP_DATE }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
